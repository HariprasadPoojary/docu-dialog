[project]
name = "docu-dialog"
version = "0.1.0"
description = "Project-scoped document chatbot with answers grounded in source documents"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.18",
    "alembic>=1.13",
    "langchain-text-splitters>=1.0",
    "pydantic-settings>=2.0",
    "pgvector>=0.4",
    "pypdf>=6.0",
    "psycopg[binary]>=3.2",
    "python-docx>=1.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
