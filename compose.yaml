services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docudialog}
      POSTGRES_USER: ${POSTGRES_USER:-docudialog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docudialog-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docudialog} -d ${POSTGRES_DB:-docudialog}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
